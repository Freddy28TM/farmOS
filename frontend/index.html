<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmOS — Water Risk Assessment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>FarmOS</h1>
            <p>Water Risk Assessment</p>
        </header>

        <section class="card">
            <h2>Farm Information</h2>

            <form id="risk-form">

                <label for="latitude">
                    Latitude
                </label>

                <input
                    id="latitude"
                    type="number"
                    step="0.000001"
                    min="-90"
                    max="90"
                    placeholder="-1.286389"
                    required
                >

                <label for="longitude">
                    Longitude
                </label>

                <input
                    id="longitude"
                    type="number"
                    step="0.000001"
                    min="-180"
                    max="180"
                    placeholder="36.817223"
                    required
                >

                <label for="crop">
                    Crop
                </label>

                <select id="crop" required>
                    <option value="">Select crop</option>
                    <option value="maize">Maize</option>
                </select>

                <label for="growth-stage">
                    Growth Stage
                </label>

                <select id="growth-stage" required>
                    <option value="">Select growth stage</option>
                    <option value="germination">Germination</option>
                    <option value="vegetative">Vegetative</option>
                    <option value="flowering">Flowering</option>
                    <option value="maturity">Maturity</option>
                </select>

                <button type="submit">
                    Assess Water Risk
                </button>

            </form>
        </section>

        <section id="result" class="card result hidden">
            <h2>Risk Assessment</h2>

            <p>
                Risk:
                <strong id="risk-level"></strong>
            </p>

            <p>
                Score:
                <strong id="score"></strong>
            </p>

            <p>
                Confidence:
                <strong id="confidence"></strong>
            </p>

            <p>
                Farm Context:
                <strong id="context"></strong>
            </p>

            <h3>Risk Factors</h3>
            <ul id="factors"></ul>

            <h3>Recommendation</h3>
            <p id="recommendation"></p>

            <h3>Explanation</h3>
            <p id="explanation"></p>
        </section>

        <p id="error" class="error hidden"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
